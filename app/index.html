<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KnowledgeOps Console</title>
<link rel="stylesheet" href="styles/style.css">
</head>
<body>
<header class="topbar">
  <h1>KnowledgeOps</h1>
  <div class="ingest">
    <label for="ticketId">Check a resolved ticket</label>
    <input id="ticketId" type="text" inputmode="numeric" placeholder="Ticket ID" />
    <button id="ingest" class="secondary" type="button">Check</button>
  </div>
</header>

<main>
  <p id="status" class="status" hidden></p>

  <div class="layout">
    <section class="panel list-panel">
      <h2 class="panel-head">Open alerts</h2>
      <div id="board"><p class="muted empty">Loading&hellip;</p></div>
    </section>
    <section class="panel review-panel">
      <h2 class="panel-head">Review</h2>
      <div id="detail"><p class="muted empty">Select an alert to review the change.</p></div>
    </section>
  </div>
</main>

<script src="{{{appclient}}}"></script>
<script src="scripts/app.js"></script>
</body>
</html>
